name: CI/CD Multiarch Portfolio Devop

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multiarch image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: roxsross12/portfolio-devop:develop-${{ steps.vars.outputs.short_sha }}
          platforms: linux/amd64,linux/arm64

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: roxsross/roxs-gitops-devops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: roxs-gitops-devops

      - name: Update image tag in ArgoCD Helm values
        run: |
          cd roxs-gitops-devops/argocd-helm
          sed -i "s|tag:.*|tag: develop-${{ steps.vars.outputs.short_sha }}|g" values.yaml

      - name: Commit and push changes to GitOps repo
        run: |
          cd roxs-gitops-devops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "ci: update portfolio-devop image to develop-${{ steps.vars.outputs.short_sha }} [skip ci]"
          git push origin main
